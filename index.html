<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#14121a" />
<title>Flipper Test · éventail</title>
<style>
  html, body { margin: 0; height: 100%; background: #14121a; overflow: hidden; overscroll-behavior: none; }
  body { font-family: system-ui, -apple-system, sans-serif; color: #fff; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; touch-action: none; }
  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: baseline; padding: 10px 14px; pointer-events: none; text-shadow: 0 1px 3px #000; }
  #score { font: 700 26px ui-monospace, Menlo, monospace; color: #ffd34d; letter-spacing: 1px; }
  #meta { text-align: right; font-size: 11px; opacity: 0.7; line-height: 1.4; }
  #power { position: fixed; right: 10px; bottom: 90px; width: 10px; height: 120px; border-radius: 5px; background: rgba(255,255,255,0.15); opacity: 0; transition: opacity .15s; pointer-events: none; overflow: hidden; }
  #powerFill { position: absolute; bottom: 0; left: 0; right: 0; height: 0; background: linear-gradient(#ff5a3c, #ffd34d); }
  #hint { position: fixed; left: 0; right: 0; bottom: 0; padding: 18px 16px 28px; background: linear-gradient(transparent, rgba(0,0,0,0.85)); text-align: center; font-size: 14px; line-height: 1.5; pointer-events: none; transition: opacity .4s; }
  #hint b { color: #ffd34d; }
  #hint.gone { opacity: 0; }
  #hint.desktop.gone { opacity: 0.6; }
  @media (min-aspect-ratio: 1/1) {
    #hint.desktop { left: 20px; right: auto; bottom: 20px; width: 300px; padding: 0; text-align: left; background: none; }
  }
  #banner { position: fixed; left: 50%; top: 22%; transform: translate(-50%, -10px); padding: 8px 16px; border-radius: 6px; background: rgba(20,18,26,0.85); color: #ffd34d; font: 700 18px ui-monospace, Menlo, monospace; letter-spacing: 1px; white-space: nowrap; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
  #banner.show { opacity: 1; transform: translate(-50%, 0); }
  #banner.alert { color: #fff; background: rgba(220,50,40,0.9); font-size: 26px; }
</style>
</head>
<body>
<div id="top">
  <div id="score">0</div>
  <div id="meta"><div id="speed">–</div><div id="balls"></div><div id="motion"></div></div>
</div>
<div id="banner"></div>
<div id="power"><div id="powerFill"></div></div>
<div id="hint">Touchez la <b>moitié gauche</b> ou <b>droite</b> de l'écran pour les flippers.<br/>Pour lancer, <b>maintenez à droite</b> puis relâchez.<br/>Pour secouer la table, <b>poussez le téléphone d'un coup sec</b> (ou glissez vite vers le haut). Attention au tilt.</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
